name: Update TOCs
# This workflow automatically updates the Table of Contents (TOC) in markdown files

on:
  push:
    branches:
      - main
      - master
    paths:
      - "*.md"
      - "!.history/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # OR "2" -> To retrieve the preceding commit.

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
        with:
          files: ./*.md

      - name: Updated toc on all markdown changed files
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          curl https://raw.githubusercontent.com/george-gca/github-markdown-toc/main/gh-md-toc -o gh-md-toc
          chmod a+x gh-md-toc
          for file in ${ALL_CHANGED_FILES}; do
            # Check if the file is a markdown file
            if [[ "$file" != *.md ]]; then
              continue
            fi
            ./gh-md-toc --indent 2 --insert --no-backup --hide-footer $file
          done
          rm gh-md-toc

      # main exige PR (ruleset "PR y checks obligatorios en main"), asi que la TOC
      # se propone en una rama en vez de commitearse directamente a main.
      - name: Propose the TOC update in a pull request
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # con PAT el PR dispara CI; con GITHUB_TOKEN no lo dispara y el admin
          # lo fusiona con bypass. Ver seccion 8.3 del informe de auditoria.
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          branch: chore/update-tocs
          delete-branch: true
          # gh-md-toc solo inserta la TOC en los .md de la raíz
          add-paths: |
            *.md
          commit-message: "chore: auto update markdown TOC"
          title: "chore: auto update markdown TOC"
          body: |
            Actualización automática de las tablas de contenido.

            `main` exige PR, así que los cambios se proponen aquí en lugar de
            commitearse directamente.
