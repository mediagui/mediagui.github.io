cv:
  name: Miguel Angel Medina
  headline: Ingeniero de Software
  email: mediagui@gmail.com
  location: Madrid, España

  social_networks:
    - network: X
      username: mediagui
    - network: GitHub
      username: mediagui
    - network: LinkedIn
      username: medinaaguilar

  sections:
    Summary:
      - Ingeniero de software con más de 20 años de experiencia en desarrollo backend en Java, especializado en Spring Boot y JPA/Hibernate, y actualmente también con soltura en Go, PostgreSQL y entornos cloud como Snowflake. He diseñado y mantenido APIs REST de alto rendimiento, integraciones complejas y arquitecturas escalables para entornos de producción exigentes. Me centro en el desarrollo backend, la arquitectura de software, la calidad del código y las mejoras prácticas de los sistemas.

    Education:
      - institution: Universidad Nacional de Educación a Distancia
        location: Madrid, España
        url: https://www.uned.es/
        area: Informática
        degree: Ingeniería del Software
        start_date: "2000"
        end_date: present

      - institution: CENEC Formación - Virgen de la Paloma (Centro de Formación Profesional)
        location: Madrid, España
        area: Informática
        degree: Titulación técnica en Sistemas Informáticos
        start_date: "1995"
        end_date: "1997"

    Experience:
      - company: Base 100 S.A.
        position: Ingeniero de Software Senior
        location: Madrid, España
        start_date: 2026-03
        end_date: present

      - company: InAtlas S.L.
        position: Ingeniero de Software Senior
        location: Madrid, España
        start_date: 2023-12
        end_date: 2026-01
        summary:
          He desarrollado y evolucionado varios microservicios REST y un monolito que está siendo convertido en otros servicios, extrayendo el núcleo de seguridad y otras partes como la lógica de reporting.
          Trabajé con Java 11/17, Spring Boot 2, PostgreSQL como base de datos y Snowflake como data warehouse, todo desplegado en AWS Cloud externalizado.
        highlights:
          - Evolución y mantenimiento de la plataforma GeoBiz.
          - Desarrollo de la plataforma GeoCRM, un CRM para las áreas de negocio definidas en GeoBiz, con arquitectura de microservicios y enfoque API first.
          - API de venta de datos, un microservicio que ofrece una API para vender datos a clientes, con arquitectura de microservicios y enfoque API first. Usando GraphQL como lenguaje de consulta y Spring Boot 2 como framework.
          - API Gateway, un microservicio que proporcionará y comprobará la autenticación para los microservicios actuales y futuros, con arquitectura de microservicios y enfoque API first. Usando Spring Boot 2 como framework y Keycloak como proveedor de identidad.

      - company: Neoris
        position: Líder Técnico
        location: Madrid, España
        start_date: 2022-04
        end_date: 2023-12
        summary:
          Liderazgo técnico de un proyecto de microservicios desde cero para Zara. Responsable de la arquitectura, la orientación técnica y el mentoring de un equipo multidisciplinar de 6 desarrolladores (2 en prácticas).
          En paralelo, evaluaciones y feedback periódico a un grupo de más de 15 personas.
        highlights:
          - Gestión del backlog junto al PO.
          - Diseño e implementación de microservicios con arquitectura MVC y hexagonal con DDD.
          - Gestión técnica exitosa de un proyecto crítico para las operaciones de taller (prensado, embalaje).
          - Automatización de CI/CD con Spinnaker y puertas de calidad con SonarQube.
          - Mentoring de desarrolladores junior.

      - company: Neoris
        position: Consultor Senior
        location: Madrid, España
        start_date: 2017-06
        end_date: 2023-12
        summary: Análisis, diseño y desarrollo en un equipo ágil multidisciplinar. Liderazgo técnico en la arquitectura de soluciones críticas para la gestión de efectivo y pagos.
        highlights:
          - Mitigación de la vulnerabilidad Log4Shell (CVE-2021-44228). Implementación de una solución temporal hasta actualizar a una versión segura en todos los proyectos. Solución desplegada en producción en 1 día.
          - Base de datos de cifrado/descifrado en tiempo real en sustitución de Oracle Transparent Data Encryption (Oracle TDE) para cumplir con la LOPD.
          - Desarrollo de una librería Java y dependencia Maven que centraliza y automatiza la prevención de vulnerabilidades críticas (XSS, CSRF, inyección SQL) en aplicaciones Java.
          - Plataforma de pagos para LATAM integrada con más de 12 bancos (aceptación de pagos en efectivo, mixtos y con tarjeta).
          - Gestor de órdenes de efectivo para Portugal (integración bancaria).
          - "Smart Cash System: gestión de usuarios, roles y permisos para cajeros automáticos. Servicio REST de cifrado/descifrado en tiempo real (crítico en rendimiento)."
          - Proxy inverso seguro (sustitución de iframes, prevención de XSS/CSRF/inyección SQL).
          - Implementación de OAuth 2 e integración con Azure Cloud.
          - Mentoring en buenas prácticas de desarrollo y pruebas unitarias.

      - company: TCS (Tata Consultancy Services)
        position: Analista Funcional / Desarrollador
        location: Madrid, España
        start_date: "2012"
        end_date: "2017"
        summary: Análisis, diseño e implementación completos de proyectos empresariales. Responsable de mejoras y mantenimiento de distintos proyectos.
        highlights:
          - Diseño e implementación de un sistema CI/CD empresarial con Jenkins + SonarQube + Maven + Archiva + SVN.
          - Arquitectura completa desde la toma de requisitos → casos de uso → diseño → implementación. Automatización de pruebas de seguridad (OWASP ZED, Jenkins).
          - "Mejoras de seguridad en una aplicación intranet monolítica: prevención de XSS/CSRF/inyección SQL."

      - company: Ayuntamiento de Madrid (Departamento de Informática - IAM)
        position: Jefe de División de Informática
        location: Madrid, España
        start_date: "2004"
        end_date: "2012"
        summary: Al frente de la división de informática del Ayuntamiento de Madrid, responsable del diseño e implementación de la estrategia y arquitectura TI del ayuntamiento. Responsable de la gestión de un equipo de más de 20 personas. Responsable del diseño y la migración de sistemas legacy a una arquitectura moderna Java y Spring.
        highlights:
          - RPT Vista Software. Herramienta de búsqueda y consulta de datos económicos y profesionales de más de 10.000 empleados (todavía en producción).
          - Migración de la arquitectura de sistemas legacy de Visual Basic 6 a Java/Spring.
          - Administración de servidores Linux Debian + Apache + MySQL.

      - company: Alfa Multimedia
        position: Analista Funcional / Desarrollador
        location: Madrid, España
        start_date: "2000"
        end_date: "2004"
        summary: Análisis, desarrollo e implementación de soluciones de gestión médica. Responsable de la infraestructura de red de la empresa. Responsable del diseño e implementación de la estrategia y arquitectura TI de la empresa. Responsable de la gestión de un equipo de más de 5 personas. Responsable del diseño y la migración de sistemas legacy a una arquitectura moderna Java y Spring.
        highlights:
          - Software de gestión de consultas médicas (GestMed). Desplegado en más de 15 clínicas. Software de gestión para colegios médicos, desde el análisis hasta el soporte operativo.
          - Diseño e implementación de la infraestructura Ethernet.
          - Administración de servidores Windows NT/2000 y Linux.

