# siempre `title="Cv pdf"`, sin decir el idioma, y no admite título propio.
cv_pdf_en:
  logo: ai ai-cv
  title: CV en inglés (PDF)
  url: /assets/pdf/CV Miguel Ángel Medina - EN.pdf
cv_pdf_es:
  logo: fa-solid fa-file-pdf # icono distinto al ai-cv del inglés, para no ver dos iguales
  title: CV en español (PDF)
  url: /assets/pdf/CV Miguel Ángel Medina - ES.pdf
email: mediagui@gmail.com # your email address
